[package]
name = "light-ai-gateway"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "OpenAI-compatible gateway that pools provider accounts and routes around exhausted quota windows"
# The floor is 1.88, not the 1.85 that edition 2024 alone asks for: the crate uses
# let-chains throughout, and the highest rust-version any dependency declares is
# 1.88.0 (time, icu_*). Declaring it means an old toolchain gets a clear message
# instead of a parse error, and that cargo's MSRV-aware resolver keeps picking
# dependency versions that still work.
rust-version = "1.88"
# The crate is light-ai-gateway, but the command every document, help text and
# error message refers to is lgw. Declaring the binary explicitly is what makes
# "cargo install" put a working lgw on PATH instead of a binary whose name
# appears nowhere in the documentation.
[[bin]]
name = "lgw"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
bytes = "1.12.1"
clap = { version = "4.6.6", features = ["derive"] }
futures-util = "0.3.34"
# v4 split the crate up: the platform stores are now separate crates and the API
# this project uses (Entry::new, get_password, set_password, delete_credential)
# lives behind the "v1" compatibility feature, which is what the default enables.
# The old per-platform feature names are gone; v1 pulls in Keychain, Windows
# Credential Manager and the Secret Service, chosen at runtime per platform.
keyring = "4"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
rpassword = "7.5.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust_decimal = { version = "1.43.0", features = ["serde-with-str"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v4"] }
